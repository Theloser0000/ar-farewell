<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BCA AR VIDEO</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- AR.JS -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

/* Tap Button */

#startBtn{

    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    padding:15px 35px;

    border:none;
    border-radius:50px;

    background:#0077ff;
    color:white;

    font-size:18px;
    font-weight:bold;

    z-index:9999;

    box-shadow:0 0 20px rgba(0,119,255,0.8);

}

</style>

</head>

<body>

<!-- VIDEO -->

<video
id="vid"
src="https://cdn.pixabay.com/video/2022/10/06/133721-757180356_large.mp4"
loop
muted
playsinline
webkit-playsinline
crossorigin="anonymous"
style="display:none;">
</video>

<!-- BUTTON -->

<button id="startBtn">
START AR
</button>

<!-- AR SCENE -->

<a-scene

embedded

vr-mode-ui="enabled:false"

renderer="
logarithmicDepthBuffer:true;
antialias:true;
alpha:true;"

arjs="
trackingMethod:best;
sourceType:webcam;
debugUIEnabled:false;">

<!-- MARKER -->

<a-marker preset="hiro">

    <!-- VIDEO -->

    <a-video

        src="#vid"

        position="0 1 0"

        width="4"

        height="2.2"

        rotation="-90 0 0">

    </a-video>

    <!-- TEXT -->

    <a-text

        value="BCA 2026"

        color="yellow"

        align="center"

        position="0 0.2 0"

        scale="4 4 4">

    </a-text>

</a-marker>

<!-- CAMERA -->

<a-entity camera></a-entity>

</a-scene>

<script>

const btn = document.getElementById("startBtn");

const video = document.getElementById("vid");

btn.addEventListener("click", async () => {

    try{

        await video.play();

        btn.style.display = "none";

    }

    catch(err){

        alert("Tap again");

    }

});

</script>

</body>
</html>
